<head>
<meta charset="utf-8">

<title>AgriSathi — कृषीसाथी</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<style>
:root{--bg:#F6F2E4;--card:#fff;--ink:#1d2a1f;--mute:#5d6b5f;--g:#1E5631;--g2:#4C9A2A;--y:#E3A72F;--line:#e3dcc6;--soft:#EAF1DC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141b15;--card:#1e2820;--ink:#eef2e6;--mute:#a9b7a9;--g:#8fd16a;--g2:#6bb544;--line:#334236;--soft:#24332a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Mukta,"Noto Sans Devanagari",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
:root[data-theme=light] header,header{background:#1E5631;color:#fff}
.logo{font-weight:800;font-size:22px;letter-spacing:.2px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:100%;order:3}
nav button{background:none;border:0;color:#dfeed3;font:600 16px Mukta,sans-serif;padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
nav button.on{background:#fff;color:#1E5631}
select,input{font:inherit;color:inherit}
.lang{margin-left:auto;background:#fff;color:#1d2a1f;border:0;border-radius:8px;padding:6px 8px}
main{max-width:1000px;margin:0 auto;padding:18px 14px 60px}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}h1{font-size:30px;font-weight:800}h2{font-size:22px}h3{font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;font:700 17px Mukta,sans-serif;padding:12px 18px;cursor:pointer;min-height:48px}
:root[data-theme=dark] .btn{color:#10200f}.btn.alt{background:var(--soft);color:var(--g)}
.btn:focus-visible,select:focus-visible,input:focus-visible,nav button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.tag{display:inline-block;background:#fff3d1;color:#6b4a00;border-radius:99px;font-size:13px;padding:1px 10px;font-weight:600}
.note{background:#fff3d1;color:#4d3800;border-radius:10px;padding:10px 12px;font-size:15px;margin:10px 0}
.stat b{font-size:30px;display:block;color:var(--g)}.mute{color:var(--mute);font-size:15px}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:12px 0}
.seg{border-radius:10px;color:#fff;text-align:center;padding:8px 2px;font-weight:800;font-size:18px;opacity:.55}
.seg small{display:block;font-weight:600;font-size:11px;line-height:1.2}.seg.on{opacity:1;outline:3px solid var(--ink);outline-offset:2px}
.crop{font-size:44px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{display:block;font-weight:600;margin:10px 0 4px}
select,input[type=number],input[type=search],input[type=text]{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.prev{max-width:100%;max-height:280px;border-radius:12px;display:block;margin:10px 0}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font:600 15px Mukta,sans-serif;cursor:pointer;color:var(--ink)}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.gbadge{display:inline-block;color:#fff;border-radius:12px;padding:8px 16px;font-weight:800;font-size:20px}
ul{padding-left:20px;margin:.3em 0}.spin{width:28px;height:28px;border:4px solid var(--line);border-top-color:var(--g2);border-radius:50%;animation:s 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1d2a1f;color:#fff;padding:10px 18px;border-radius:12px;z-index:9}
footer{text-align:center;color:var(--mute);font-size:14px;padding:20px}
</style>
</head>

function pMarket(){const cats=['all','fert','test','pest','seed','tool'];const list=P.filter(p=>(S.cat==='all'||p.c===S.cat)&&(!S.cropF||p.cr==='all'||p.cr===S.cropF)&&p.n[L].toLowerCase().includes(S.q.toLowerCase()));
const items=Object.keys(S.cart).map(id=>[P.find(p=>p.id==id),S.cart[id]]).filter(x=>x[0]);const tot=items.reduce((a,x)=>a+x[0].pr*x[1],0);
return `<h1>🛒 ${t('market')}</h1><div class="note">${t('sampP')}</div>${S.cropF?`<p class="row"><span class="tag">${t('for')} ${C[S.cropF].n[L]}</span><button class="chip" onclick="S.cropF=null;draw()">✕</button></p>`:''}
<input type="search" aria-label="${t('srch')}" placeholder="${t('srch')}" value="${S.q}" oninput="S.q=this.value;draw(true)" id="q"><div class="row" style="margin:10px 0">${cats.map(c=>`<button class="chip ${S.cat===c?'on':''}" onclick="S.cat='${c}';draw()">${t(c)}</button>`).join('')}</div>
<div class="grid">${list.map(p=>`<div class="card"><div class="crop" aria-hidden="true">${p.e}</div><h3>${p.n[L]}</h3><p class="mute">${t(p.c)} · ${p.cr==='all'?t('all'):C[p.cr].n[L]}</p><p><b>${rupee(p.pr)}</b> <span class="tag">${t('sample')}</span></p><button class="btn alt" onclick="addC(${p.id})">${t('add')}</button></div>`).join('')}</div>
<div class="card" id="cart"><h2>${t('cart')}</h2>${S.order?`<div class="note">${t('done')}</div>`:items.length?items.map(([p,q])=>`<div class="row" style="justify-content:space-between;margin:6px 0"><span>${p.e} ${p.n[L]}</span><span class="row"><button class="chip" aria-label="-" onclick="qty(${p.id},-1)">−</button><b>${q}</b><button class="chip" aria-label="+" onclick="qty(${p.id},1)">+</button> ${rupee(p.pr*q)}</span></div>`).join('')+`<h3>${t('total')}: ${rupee(tot)}</h3><button class="btn" onclick="S.cart={};ls.set('as_cart',{});S.order=true;draw()">${t('chk')}</button>`:`<p class="mute">${t('emptyC')}</p>`}</div>`}
function addC(id){S.cart[id]=(S.cart[id]||0)+1;ls.set('as_cart',S.cart);S.order=false;draw();toast('✓ '+P.find(p=>p.id===id).n[L])}
function qty(id,d){S.cart[id]=(S.cart[id]||0)+d;if(S.cart[id]<=0)delete S.cart[id];ls.set('as_cart',S.cart);draw()}
// ---- shell
const PG={home:pHome,scan:pScan,soil:pSoil,advice:pAdvice,market:pMarket};
function draw(keepFocus){const y=scrollY;$('#app').innerHTML=PG[S.route]();$('#nav').innerHTML=Object.keys(PG).map(k=>`<button class="${S.route===k?'on':''}" onclick="go('${k}')">${t(k)}</button>`).join('');$('#foot').textContent=t('foot');
if(keepFocus){const q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}scrollTo(0,y)}
function setLang(i){L=+i;ls.set('as_lang',L);document.documentElement.lang=['en','hi','mr'][L];draw()}
$('#lang').innerHTML=LANGS.map((l,i)=>`<option value="${i}">${l[1]}</option>`).join('');
$('#lang').value=L;$('#lang').onchange=e=>setLang(e.target.value);
S.route=PG[location.hash.slice(1)]?location.hash.slice(1):'home';addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(PG[h]&&h!==S.route){S.route=h;draw()}});
setLang(L);
</script>
</body>
</html>
